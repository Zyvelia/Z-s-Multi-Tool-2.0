name: Build

# Builds the PyInstaller exe AND the Inno Setup installer on every
# push/PR, so both are downloadable as artifacts from any run. On a
# version tag (e.g. "v3.5.0") it additionally publishes a GitHub Release
# with the installer attached.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # build.bat is Windows-only (PyInstaller --uac-admin, VLC bundling,
    # Inno Setup), so this has to run on a Windows runner.
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Match this to whatever Python version you build with locally.
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # build.bat installs PyInstaller itself if missing, refreshes
      # requirements-lock.txt, runs PyInstaller, renames the exe, and
      # auto-downloads a VLC runtime to bundle next to it.
      #
      # "< NUL" feeds an empty/closed stdin to the whole script so its
      # `pause` calls (including the one at the very end on success)
      # return immediately instead of hanging the job forever waiting
      # for a keypress that a CI runner can never send.
      - name: Run build.bat
        shell: cmd
        run: build.bat < NUL

      - name: Verify exe was produced
        shell: cmd
        run: |
          if not exist "dist\Z's Multi Tool.exe" (
            echo Build did not produce dist\Z's Multi Tool.exe
            exit /b 1
          )

      - name: Upload exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: ZsMultiTool-exe
          path: dist/**
          if-no-files-found: error

      # ---- Installer ----
      # Built on every run (not just tags) so a plain push/PR gives you a
      # downloadable full installer artifact too, not just the raw exe.

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" install.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ZsMultiTool-Installer
          path: installer_output/*.exe
          if-no-files-found: error

      # ---- GitHub Release (tags only) ----
      # Only cuts an actual Release on a version tag - regular pushes/PRs
      # still get both artifacts above, just not published as a Release.

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            installer_output/*.exe
          generate_release_notes: true
